<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniChat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2ff;
    color: #172033;
}

header {
    background: #4f46e5;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px;
}

main {
    max-width: 900px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    margin-bottom: 18px;
}

input,
textarea,
button {
    font: inherit;
    border-radius: 9px;
    padding: 12px;
}

input,
textarea {
    width: 100%;
    border: 1px solid #cbd5e1;
    margin: 7px 0;
}

button {
    border: none;
    background: #4f46e5;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #3730a3;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

nav button {
    flex: 1;
}

.hidden {
    display: none !important;
}

.error {
    color: #b91c1c;
    white-space: pre-wrap;
    margin-top: 10px;
}

.success {
    color: #15803d;
    margin-top: 10px;
}

.message {
    background: #f1f5f9;
    border-radius: 10px;
    padding: 12px;
    margin: 8px 0;
    overflow-wrap: anywhere;
}

.message b {
    color: #4f46e5;
}

small {
    color: #64748b;
}

#listeMessages {
    max-height: 400px;
    overflow-y: auto;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<header>
    <h1>💬 MiniChat</h1>
    <div id="statut">Non connecté</div>
</header>

<main>

    <!-- CONNEXION -->
    <section id="connexion" class="card">

        <h2>Entrer dans MiniChat</h2>

        <p>Choisis un pseudo pour entrer dans le chat.</p>

        <input
            id="pseudoInput"
            type="text"
            maxlength="30"
            placeholder="Ton pseudo"
            autocomplete="off"
        >

        <button
            id="boutonConnexion"
            type="button"
            style="width:100%; margin-top:10px;"
        >
            Entrer dans MiniChat
        </button>

        <div id="erreurConnexion" class="error"></div>

    </section>


    <!-- APPLICATION -->
    <section id="application" class="hidden">

        <nav>
            <button type="button" id="btnPublic">
                💬 Public
            </button>

            <button type="button" id="btnProfil">
                👤 Profil
            </button>

            <button type="button" id="btnDeconnexion">
                🚪 Quitter
            </button>
        </nav>


        <!-- CHAT PUBLIC -->
        <section id="public" class="card">

            <h2>💬 Discussion publique</h2>

            <div id="listeMessages">
                <small>Aucun message pour le moment.</small>
            </div>

            <textarea
                id="messageInput"
                rows="3"
                maxlength="500"
                placeholder="Écris ton message..."
            ></textarea>

            <button
                type="button"
                id="btnEnvoyer"
            >
                Envoyer
            </button>

            <div id="erreurChat" class="error"></div>

        </section>


        <!-- PROFIL -->
        <section id="profil" class="card hidden">

            <h2>👤 Mon profil</h2>

            <p>
                Connecté en tant que :
                <b id="pseudoAffiche"></b>
            </p>

            <input
                id="nouveauPseudo"
                type="text"
                maxlength="30"
                placeholder="Nouveau pseudo"
            >

            <button
                type="button"
                id="btnChangerPseudo"
            >
                Changer de pseudo
            </button>

            <div id="erreurProfil" class="error"></div>

            <div id="succesProfil" class="success"></div>

        </section>

    </section>

</main>


<script>
"use strict";

/* ============================= */
/* CONFIGURATION SUPABASE        */
/* ============================= */

const SUPABASE_URL =
    "https://yntyarldepwjlbbeobja.supabase.co";

const SUPABASE_KEY =
    "sb_publishable__x0aufIHmmpaAj_FdTyc-w_RPgErGE9";

let client = null;
let pseudo = localStorage.getItem("minichat_pseudo") || "";


/* ============================= */
/* OUTILS                        */
/* ============================= */

function element(id) {
    return document.getElementById(id);
}

function afficherErreur(id, message) {
    const zone = element(id);

    if (zone) {
        zone.textContent = message || "";
    }
}


/* ============================= */
/* AFFICHAGE                     */
/* ============================= */

function actualiserAffichage() {

    const connecte = pseudo !== "";

    element("connexion").classList.toggle(
        "hidden",
        connecte
    );

    element("application").classList.toggle(
        "hidden",
        !connecte
    );

    element("statut").textContent = connecte
        ? "Connecté : " + pseudo
        : "Non connecté";

    element("pseudoAffiche").textContent = pseudo;
}


/* ============================= */
/* CONNEXION                     */
/* ============================= */

async function connecterPseudo() {

    const nouveauPseudo =
        element("pseudoInput").value.trim();

    if (!nouveauPseudo) {
        afficherErreur(
            "erreurConnexion",
            "Entre un pseudo."
        );
        return;
    }

    if (!client) {
        afficherErreur(
            "erreurConnexion",
            "Supabase ne s'est pas chargé. Recharge la page."
        );
        return;
    }

    element("boutonConnexion").disabled = true;

    afficherErreur(
        "erreurConnexion",
        "Connexion en cours..."
    );

    try {

        const resultat = await client
            .from("utilisateurs")
            .upsert(
                {
                    pseudo: nouveauPseudo
                },
                {
                    onConflict: "pseudo",
                    ignoreDuplicates: true
                }
            );

        if (resultat.error) {
            throw resultat.error;
        }

        pseudo = nouveauPseudo;

        localStorage.setItem(
            "minichat_pseudo",
            pseudo
        );

        afficherErreur(
            "erreurConnexion",
            ""
        );

        actualiserAffichage();

        await chargerMessages();

    } catch (erreur) {

        afficherErreur(
            "erreurConnexion",

            "Impossible d'entrer dans MiniChat.\n\n" +
            "Erreur : " +
            (erreur.message || erreur) +
            "\n\n" +
            "Si le message parle de RLS ou de permissions, " +
            "il faut modifier les règles de sécurité dans Supabase."
        );

    } finally {

        element("boutonConnexion").disabled = false;

    }
}


/* ============================= */
/* CHARGER LES MESSAGES          */
/* ============================= */

async function chargerMessages() {

    if (!client) {
        return;
    }

    const zone =
        element("listeMessages");

    try {

        const resultat = await client
            .from("messages")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: true
                }
            )
            .limit(100);

        if (resultat.error) {
            throw resultat.error;
        }

        const messages = resultat.data || [];

        zone.innerHTML = "";

        if (messages.length === 0) {

            zone.innerHTML =
                "<small>Aucun message pour le moment.</small>";

            return;
        }

        messages.forEach(message => {

            const bloc =
                document.createElement("div");

            bloc.className = "message";

            const auteur =
                message.pseudo ||
                message.auteur ||
                "Utilisateur";

            const texte =
                message.message ||
                message.texte ||
                message.contenu ||
                "";

            const nom =
                document.createElement("b");

            nom.textContent = auteur;

            const contenu =
                document.createElement("span");

            contenu.textContent = texte;

            bloc.appendChild(nom);

            bloc.appendChild(
                document.createElement("br")
            );

            bloc.appendChild(contenu);

            zone.appendChild(bloc);

        });

    } catch (erreur) {

        afficherErreur(
            "erreurChat",
            "Impossible de charger les messages : " +
            (erreur.message || erreur)
        );

    }
}


/* ============================= */
/* ENVOYER UN MESSAGE            */
/* ============================= */

async function envoyerMessage() {

    const champ =
        element("messageInput");

    const texte =
        champ.value.trim();

    if (!texte) {
        return;
    }

    if (!client) {
        afficherErreur(
            "erreurChat",
            "Supabase n'est pas disponible."
        );
        return;
    }

    element("btnEnvoyer").disabled = true;

    afficherErreur(
        "erreurChat",
        ""
    );

    try {

        const resultat = await client
            .from("messages")
            .insert({
                pseudo: pseudo,
                message: texte
            });

        if (resultat.error) {
            throw resultat.error;
        }

        champ.value = "";

        await chargerMessages();

    } catch (erreur) {

        afficherErreur(
            "erreurChat",
            "Impossible d'envoyer le message : " +
            (erreur.message || erreur)
        );

    } finally {

        element("btnEnvoyer").disabled = false;

    }
}


/* ============================= */
/* CHANGER DE PAGE               */
/* ============================= */

function changerVue(vue) {

    element("public").classList.toggle(
        "hidden",
        vue !== "public"
    );

    element("profil").classList.toggle(
        "hidden",
        vue !== "profil"
    );

}


/* ============================= */
/* CHANGER DE PSEUDO             */
/* ============================= */

async function changerPseudo() {

    const nouveau =
        element("nouveauPseudo").value.trim();

    if (!nouveau) {

        afficherErreur(
            "erreurProfil",
            "Entre un nouveau pseudo."
        );

        return;
    }

    try {

        const resultat = await client
            .from("utilisateurs")
            .upsert(
                {
                    pseudo: nouveau
                },
                {
                    onConflict: "pseudo",
                    ignoreDuplicates: true
                }
            );

        if (resultat.error) {
            throw resultat.error;
        }

        pseudo = nouveau;

        localStorage.setItem(
            "minichat_pseudo",
            pseudo
        );

        actualiserAffichage();

        element("nouveauPseudo").value = "";

        afficherErreur(
            "erreurProfil",
            ""
        );

        element("succesProfil").textContent =
            "Pseudo changé avec succès.";

    } catch (erreur) {

        afficherErreur(
            "erreurProfil",
            "Impossible de changer le pseudo : " +
            (erreur.message || erreur)
        );

    }
}


/* ============================= */
/* DÉCONNEXION                   */
/* ============================= */

function deconnecter() {

    pseudo = "";

    localStorage.removeItem(
        "minichat_pseudo"
    );

    element("pseudoInput").value = "";

    actualiserAffichage();

    changerVue("public");

}


/* ============================= */
/* INITIALISATION                */
/* ============================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        if (!window.supabase) {

            afficherErreur(
                "erreurConnexion",
                "La bibliothèque Supabase ne s'est pas chargée. " +
                "Vérifie ta connexion Internet puis recharge la page."
            );

        } else {

            client =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY
                );

        }


        element("boutonConnexion")
            .addEventListener(
                "click",
                connecterPseudo
            );


        element("pseudoInput")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {
                        connecterPseudo();
                    }

                }
            );


        element("btnEnvoyer")
            .addEventListener(
                "click",
                envoyerMessage
            );


        element("messageInput")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter" &&
                        !event.shiftKey
                    ) {

                        event.preventDefault();

                        envoyerMessage();

                    }

                }
            );


        element("btnPublic")
            .addEventListener(
                "click",
                function() {
                    changerVue("public");
                }
            );


        element("btnProfil")
            .addEventListener(
                "click",
                function() {
                    changerVue("profil");
                }
            );


        element("btnDeconnexion")
            .addEventListener(
                "click",
                deconnecter
            );


        element("btnChangerPseudo")
            .addEventListener(
                "click",
                changerPseudo
            );


        actualiserAffichage();


        if (pseudo) {
            chargerMessages();
        }

    }
);


/* ============================= */
/* AFFICHER LES ERREURS JS       */
/* ============================= */

window.addEventListener(
    "error",
    function(event) {

        if (!pseudo) {

            afficherErreur(
                "erreurConnexion",
                "Erreur JavaScript : " +
                event.message
            );

        } else {

            afficherErreur(
                "erreurChat",
                "Erreur JavaScript : " +
                event.message
            );

        }

    }
);

</script>

</body>
</html>
