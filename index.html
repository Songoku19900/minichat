<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniChat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef2ff;
    color:#1e293b;
}

.application{
    display:flex;
    max-width:1150px;
    height:92vh;
    margin:4vh auto;
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 35px #0002;
}

.menu{
    width:240px;
    background:#312e81;
    color:white;
    padding:20px;
}

.menu h1{
    margin-top:0;
    margin-bottom:25px;
}

.menu button{
    display:block;
    width:100%;
    margin:10px 0;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    text-align:left;
    cursor:pointer;
}

.menu button:hover,
.menu button.actif{
    background:#818cf8;
}

.contenu{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

header{
    background:#4f46e5;
    color:white;
    padding:18px;
}

header h2{
    margin:0 0 5px;
}

.page{
    display:none;
    flex:1;
    min-height:0;
    flex-direction:column;
    padding:20px;
}

.page.actif{
    display:flex;
}

.messages{
    flex:1;
    overflow-y:auto;
    background:#f8fafc;
    border-radius:12px;
    padding:12px;
}

.message{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:10px;
    margin:8px 0;
    max-width:85%;
    overflow-wrap:anywhere;
}

.message.moi{
    margin-left:auto;
    background:#e0e7ff;
}

.message small{
    display:block;
    color:#64748b;
    margin-bottom:5px;
}

form,
.ligne{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

input{
    flex:1;
    min-width:0;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    font:inherit;
}

button{
    padding:12px;
    border:none;
    border-radius:9px;
    background:#4f46e5;
    color:white;
    cursor:pointer;
    font:inherit;
}

button:hover{
    filter:brightness(.95);
}

.bouton-secondaire{
    background:#e2e8f0;
    color:#1e293b;
}

.information{
    background:#fff7ed;
    color:#9a3412;
    padding:10px;
    border-radius:10px;
    margin:10px 0;
}

.erreur{
    color:#b91c1c;
    margin-top:8px;
    white-space:pre-wrap;
}

.succes{
    color:#15803d;
    margin-top:8px;
    white-space:pre-wrap;
}

.liste-groupes{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:10px;
}

.groupe-bouton{
    background:#e2e8f0;
    color:#1e293b;
}

.groupe-bouton.selectionne{
    background:#a5b4fc;
}

#connexion{
    position:fixed;
    inset:0;
    background:#0008;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:10;
}

.boite-connexion{
    background:white;
    border-radius:16px;
    padding:25px;
    width:100%;
    max-width:410px;
}

.boite-connexion h2{
    margin-top:0;
}

.boite-connexion p{
    line-height:1.5;
}

@media(max-width:650px){
    .application{
        height:100vh;
        margin:0;
        border-radius:0;
    }

    .menu{
        width:70px;
        padding:8px;
    }

    .menu h1{
        font-size:0;
    }

    .menu h1::after{
        content:"💬";
        font-size:25px;
    }

    .menu button{
        font-size:0;
        text-align:center;
        padding:14px 4px;
    }

    .menu button::first-letter{
        font-size:20px;
    }
}
</style>
</head>

<body>

<!-- CONNEXION SANS MOT DE PASSE -->

<div id="connexion">
    <div class="boite-connexion">
        <h2>💬 Bienvenue sur MiniChat</h2>

        <p>
            Entre ton adresse e-mail et ton pseudo.
            Tu recevras un lien de connexion.
        </p>

        <input
            type="email"
            id="emailInput"
            placeholder="Ton adresse e-mail"
            style="width:100%;margin-top:10px"
        >

        <input
            type="text"
            id="pseudoInput"
            maxlength="25"
            placeholder="Ton pseudo"
            style="width:100%;margin-top:10px"
        >

        <button
            id="boutonConnexion"
            style="width:100%;margin-top:10px"
        >
            Recevoir le lien de connexion
        </button>

        <div id="erreurConnexion" class="erreur"></div>
    </div>
</div>

<!-- APPLICATION -->

<div class="application">

    <aside class="menu">
        <h1>MiniChat</h1>

        <button class="navigation actif" data-page="public">
            🌍 Discussion publique
        </button>

        <button class="navigation" data-page="prive">
            🔒 Messages privés
        </button>

        <button class="navigation" data-page="groupes">
            👥 Groupes
        </button>

        <button class="navigation" data-page="profil">
            ⚙️ Mon profil
        </button>
    </aside>

    <main class="contenu">

        <header>
            <h2 id="titrePage">Discussion publique</h2>
            <div id="utilisateurConnecte"></div>
        </header>

        <!-- DISCUSSION PUBLIQUE -->

        <section id="public" class="page actif">

            <div id="messagesPublics" class="messages"></div>

            <form id="formulairePublic">
                <input
                    id="textePublic"
                    maxlength="500"
                    placeholder="Écris un message public..."
                >

                <button>Envoyer</button>
            </form>

            <div id="erreurPublic" class="erreur"></div>
        </section>

        <!-- MESSAGES PRIVÉS -->

        <section id="prive" class="page">

            <div class="ligne">
                <input
                    id="pseudoDestinataire"
                    maxlength="25"
                    placeholder="Pseudo du destinataire"
                >

                <button id="ouvrirConversation">
                    Ouvrir
                </button>
            </div>

            <div id="informationPrivee" class="information">
                Choisis un pseudo pour ouvrir une conversation privée.
            </div>

            <div id="messagesPrives" class="messages"></div>

            <form id="formulairePrive">
                <input
                    id="textePrive"
                    maxlength="500"
                    placeholder="Écris un message privé..."
                >

                <button>Envoyer</button>
            </form>

            <div id="erreurPrive" class="erreur"></div>
        </section>

        <!-- GROUPES -->

        <section id="groupes" class="page">

            <div class="ligne">
                <input
                    id="nomGroupe"
                    maxlength="50"
                    placeholder="Nom du nouveau groupe"
                >

                <button id="creerGroupe">
                    Créer
                </button>
            </div>

            <div id="listeGroupes" class="liste-groupes"></div>

            <div id="informationGroupe" class="information">
                Sélectionne un groupe.
            </div>

            <div id="messagesGroupes" class="messages"></div>

            <form id="formulaireGroupe">
                <input
                    id="texteGroupe"
                    maxlength="500"
                    placeholder="Écris dans le groupe..."
                >

                <button>Envoyer</button>
            </form>

            <div id="erreurGroupe" class="erreur"></div>
        </section>

        <!-- PROFIL -->

        <section id="profil" class="page">

            <h3>Mon profil</h3>

            <p id="texteProfil"></p>

            <p>Ton pseudo est enregistré dans Supabase.</p>

            <button id="changerPseudo" class="bouton-secondaire">
                Changer de pseudo
            </button>
        </section>

    </main>
</div>

<script>
/* CONFIGURATION SUPABASE */

const SUPABASE_URL =
    "https://yntyarldepwjlbbeobja.supabase.co";

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHlhcmxkZXB3amxiYmVvYmphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMjA4MDYsImV4cCI6MjEwNDc5NjgwNn0.hfE2Vb3aYqI5TAZ7jc3fxXXOecmIC_nud98NECGw2u0";

const base = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* VARIABLES */

let pseudo = "";
let utilisateurAuth = null;
let conversationActuelle = null;
let destinataireActuel = "";
let groupeActuel = null;

/* OUTILS */

function id(nom){
    return document.getElementById(nom);
}

function afficherErreur(element, message = ""){
    id(element).textContent = message;
    id(element).className = "erreur";
}

function afficherSucces(element, message = ""){
    id(element).textContent = message;
    id(element).className = "succes";
}

function verifierConnexion(element){
    if(!utilisateurAuth){
        afficherErreur(
            element,
            "Tu dois être connecté pour effectuer cette action."
        );

        return false;
    }

    return true;
}

function actualiserProfil(){
    id("utilisateurConnecte").textContent =
        "Connecté en tant que : " + pseudo;

    id("texteProfil").textContent =
        "Ton pseudo actuel est : " + pseudo;
}

/* NAVIGATION */

document.querySelectorAll(".navigation").forEach(bouton => {

    bouton.addEventListener("click", () => {

        const page = bouton.dataset.page;

        document.querySelectorAll(".page").forEach(section => {
            section.classList.toggle(
                "actif",
                section.id === page
            );
        });

        document.querySelectorAll(".navigation").forEach(b => {
            b.classList.toggle(
                "actif",
                b === bouton
            );
        });

        const titres = {
            public: "Discussion publique",
            prive: "Messages privés",
            groupes: "Groupes",
            profil: "Mon profil"
        };

        id("titrePage").textContent = titres[page];

        if(page === "public"){
            chargerMessagesPublics();
        }

        if(page === "groupes"){
            chargerGroupes();
        }

        if(page === "prive" && conversationActuelle){
            chargerMessagesPrives();
        }
    });
});

/* AFFICHER UN MESSAGE */

function afficherMessage(element, message){

    const bloc = document.createElement("div");

    bloc.className = "message";

    if(
        utilisateurAuth &&
        message.auteur_auth_id === utilisateurAuth.id
    ){
        bloc.classList.add("moi");
    }

    const auteur = document.createElement("small");

    auteur.textContent =
        (message.pseudo || "Utilisateur") +
        " • " +
        new Date(message.created_at).toLocaleString("fr-FR");

    const texte = document.createElement("div");

    texte.textContent = message.text;

    bloc.appendChild(auteur);
    bloc.appendChild(texte);

    id(element).appendChild(bloc);
}

/* CONNEXION SANS MOT DE PASSE */

async function connecterCompte(){

    const email = id("emailInput").value.trim();
    const nouveauPseudo = id("pseudoInput").value.trim();

    afficherErreur("erreurConnexion");

    if(!email || !nouveauPseudo){
        afficherErreur(
            "erreurConnexion",
            "Entre ton adresse e-mail et ton pseudo."
        );

        return;
    }

    if(nouveauPseudo.length < 2){
        afficherErreur(
            "erreurConnexion",
            "Ton pseudo doit contenir au moins 2 caractères."
        );

        return;
    }

    localStorage.setItem(
        "pseudoEnAttente",
        nouveauPseudo
    );

    const resultat = await base.auth.signInWithOtp({
        email: email,

        options: {
            emailRedirectTo: window.location.href
        }
    });

    if(resultat.error){
        afficherErreur(
            "erreurConnexion",
            resultat.error.message
        );

        return;
    }

    afficherSucces(
        "erreurConnexion",
        "Un lien de connexion vient d'être envoyé à ton adresse e-mail."
    );
}

/* CHARGER LE PROFIL APRÈS CONNEXION */

async function chargerProfilApresConnexion(){

    if(!utilisateurAuth){
        return false;
    }

    let profil = await base
        .from("utilisateurs")
        .select("pseudo,auth_id")
        .eq("auth_id", utilisateurAuth.id)
        .maybeSingle();

    if(profil.error){
        afficherErreur(
            "erreurConnexion",
            profil.error.message
        );

        return false;
    }

    /*
       Si aucun profil n'existe encore,
       on utilise le pseudo enregistré avant l'envoi du lien.
    */

    if(!profil.data){

        const pseudoEnAttente =
            localStorage.getItem("pseudoEnAttente");

        if(!pseudoEnAttente){

            afficherErreur(
                "erreurConnexion",
                "Aucun pseudo trouvé. Recommence la connexion."
            );

            return false;
        }

        const creationProfil = await base
            .from("utilisateurs")
            .insert({
                pseudo: pseudoEnAttente,
                auth_id: utilisateurAuth.id
            })
            .select("pseudo,auth_id")
            .single();

        if(creationProfil.error){

            afficherErreur(
                "erreurConnexion",
                "Impossible de créer ton profil : " +
                creationProfil.error.message
            );

            return false;
        }

        profil = creationProfil;

        localStorage.removeItem("pseudoEnAttente");
    }

    if(profil.error || !profil.data){

        afficherErreur(
            "erreurConnexion",
            "Profil MiniChat introuvable."
        );

        return false;
    }

    pseudo = profil.data.pseudo;

    return true;
}

/* MESSAGES PUBLICS */

async function chargerMessagesPublics(){

    const resultat = await base
        .from("messages")
        .select("id,pseudo,text,created_at,auteur_auth_id")
        .order("created_at", {
            ascending:true
        });

    if(resultat.error){

        afficherErreur(
            "erreurPublic",
            resultat.error.message
        );

        return;
    }

    const zone = id("messagesPublics");

    const etaitEnBas =
        zone.scrollHeight -
        zone.scrollTop -
        zone.clientHeight < 30;

    zone.replaceChildren();

    resultat.data.forEach(message => {
        afficherMessage(
            "messagesPublics",
            message
        );
    });

    if(etaitEnBas){
        zone.scrollTop = zone.scrollHeight;
    }
}

id("formulairePublic").addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        if(!verifierConnexion("erreurPublic")){
            return;
        }

        const texte = id("textePublic").value.trim();

        if(!texte){
            return;
        }

        const resultat = await base
            .from("messages")
            .insert({
                pseudo:pseudo,
                text:texte,
                auteur_auth_id:utilisateurAuth.id
            });

        if(resultat.error){

            afficherErreur(
                "erreurPublic",
                resultat.error.message
            );

            return;
        }

        id("textePublic").value = "";

        await chargerMessagesPublics();
    }
);

/* MESSAGES PRIVÉS */

async function trouverConversation(destinataire){

    const recherche1 = await base
        .from("conversations_privees")
        .select("id,utilisateur1,utilisateur2")
        .eq("utilisateur1",pseudo)
        .eq("utilisateur2",destinataire)
        .limit(1);

    if(recherche1.error){
        throw recherche1.error;
    }

    if(recherche1.data.length > 0){
        return recherche1.data[0];
    }

    const recherche2 = await base
        .from("conversations_privees")
        .select("id,utilisateur1,utilisateur2")
        .eq("utilisateur1",destinataire)
        .eq("utilisateur2",pseudo)
        .limit(1);

    if(recherche2.error){
        throw recherche2.error;
    }

    if(recherche2.data.length > 0){
        return recherche2.data[0];
    }

    return null;
}

async function ouvrirLaConversation(){

    if(!verifierConnexion("erreurPrive")){
        return;
    }

    const destinataire =
        id("pseudoDestinataire").value.trim();

    afficherErreur("erreurPrive");

    if(!destinataire){

        afficherErreur(
            "erreurPrive",
            "Entre le pseudo du destinataire."
        );

        return;
    }

    if(
        destinataire.toLowerCase() ===
        pseudo.toLowerCase()
    ){

        afficherErreur(
            "erreurPrive",
            "Tu ne peux pas discuter avec toi-même."
        );

        return;
    }

    try{

        let conversation =
            await trouverConversation(destinataire);

        if(!conversation){

            const creation = await base
                .from("conversations_privees")
                .insert({
                    utilisateur1:pseudo,
                    utilisateur2:destinataire,
                    utilisateur1_auth_id:utilisateurAuth.id
                })
                .select("id,utilisateur1,utilisateur2")
                .single();

            if(creation.error){
                throw creation.error;
            }

            conversation = creation.data;
        }

        conversationActuelle = conversation.id;
        destinataireActuel = destinataire;

        id("informationPrivee").textContent =
            "Conversation avec : " + destinataire;

        await chargerMessagesPrives();

    }catch(erreur){

        afficherErreur(
            "erreurPrive",
            "Erreur : " + erreur.message
        );
    }
}

id("ouvrirConversation").addEventListener(
    "click",
    ouvrirLaConversation
);

id("pseudoDestinataire").addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();

            ouvrirLaConversation();
        }
    }
);

async function chargerMessagesPrives(){

    if(!conversationActuelle){
        return;
    }

    const resultat = await base
        .from("messages_prives")
        .select("pseudo,text,created_at,auteur_auth_id")
        .eq("conversation_id",conversationActuelle)
        .order("created_at", {
            ascending:true
        });

    if(resultat.error){

        afficherErreur(
            "erreurPrive",
            resultat.error.message
        );

        return;
    }

    id("messagesPrives").replaceChildren();

    resultat.data.forEach(message => {

        afficherMessage(
            "messagesPrives",
            message
        );
    });

    id("messagesPrives").scrollTop =
        id("messagesPrives").scrollHeight;
}

id("formulairePrive").addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        if(!verifierConnexion("erreurPrive")){
            return;
        }

        const texte = id("textePrive").value.trim();

        if(!texte){
            return;
        }

        if(!conversationActuelle){

            afficherErreur(
                "erreurPrive",
                "Ouvre d'abord une conversation."
            );

            return;
        }

        const resultat = await base
            .from("messages_prives")
            .insert({
                conversation_id:conversationActuelle,
                pseudo:pseudo,
                text:texte,
                auteur_auth_id:utilisateurAuth.id
            });

        if(resultat.error){

            afficherErreur(
                "erreurPrive",
                resultat.error.message
            );

            return;
        }

        id("textePrive").value = "";

        await chargerMessagesPrives();
    }
);

/* GROUPES */

async function chargerGroupes(){

    const resultat = await base
        .from("groupes")
        .select("id,nom,createur,createur_auth_id")
        .order("created_at", {
            ascending:true
        });

    if(resultat.error){

        afficherErreur(
            "erreurGroupe",
            resultat.error.message
        );

        return;
    }

    id("listeGroupes").replaceChildren();

    resultat.data.forEach(groupe => {

        const bouton = document.createElement("button");

        bouton.className = "groupe-bouton";

        if(groupe.id === groupeActuel){
            bouton.classList.add("selectionne");
        }

        bouton.textContent = "👥 " + groupe.nom;

        bouton.addEventListener(
            "click",
            () => choisirGroupe(groupe)
        );

        id("listeGroupes").appendChild(bouton);
    });
}

id("creerGroupe").addEventListener(
    "click",
    async () => {

        if(!verifierConnexion("erreurGroupe")){
            return;
        }

        const nom = id("nomGroupe").value.trim();

        if(!nom){
            return;
        }

        const resultat = await base
            .from("groupes")
            .insert({
                nom:nom,
                createur:pseudo,
                createur_auth_id:utilisateurAuth.id
            })
            .select()
            .single();

        if(resultat.error){

            afficherErreur(
                "erreurGroupe",
                resultat.error.message
            );

            return;
        }

        const ajoutMembre = await base
            .from("membres_groupes")
            .insert({
                groupe_id:resultat.data.id,
                pseudo:pseudo,
                membre_auth_id:utilisateurAuth.id
            });

        if(ajoutMembre.error){

            afficherErreur(
                "erreurGroupe",
                ajoutMembre.error.message
            );

            return;
        }

        id("nomGroupe").value = "";

        groupeActuel = resultat.data.id;

        await chargerGroupes();

        await choisirGroupe(resultat.data);
    }
);

async function choisirGroupe(groupe){

    groupeActuel = groupe.id;

    id("informationGroupe").textContent =
        "Groupe : " +
        groupe.nom +
        " • Créateur : " +
        groupe.createur;

    await chargerMessagesGroupes();

    await chargerGroupes();
}

async function chargerMessagesGroupes(){

    if(!groupeActuel){
        return;
    }

    const resultat = await base
        .from("messages_groupes")
        .select("pseudo,text,created_at,auteur_auth_id")
        .eq("groupe_id",groupeActuel)
        .order("created_at", {
            ascending:true
        });

    if(resultat.error){

        afficherErreur(
            "erreurGroupe",
            resultat.error.message
        );

        return;
    }

    id("messagesGroupes").replaceChildren();

    resultat.data.forEach(message => {

        afficherMessage(
            "messagesGroupes",
            message
        );
    });

    id("messagesGroupes").scrollTop =
        id("messagesGroupes").scrollHeight;
}

id("formulaireGroupe").addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        if(!verifierConnexion("erreurGroupe")){
            return;
        }

        const texte = id("texteGroupe").value.trim();

        if(!texte){
            return;
        }

        if(!groupeActuel){

            afficherErreur(
                "erreurGroupe",
                "Sélectionne d'abord un groupe."
            );

            return;
        }

        const resultat = await base
            .from("messages_groupes")
            .insert({
                groupe_id:groupeActuel,
                pseudo:pseudo,
                text:texte,
                auteur_auth_id:utilisateurAuth.id
            });

        if(resultat.error){

            afficherErreur(
                "erreurGroupe",
                resultat.error.message
            );

            return;
        }

        id("texteGroupe").value = "";

        await chargerMessagesGroupes();
    }
);

/* CHANGER DE PSEUDO */

id("changerPseudo").addEventListener(
    "click",
    async () => {

        if(!verifierConnexion("erreurConnexion")){
            return;
        }

        const nouveauPseudo = prompt(
            "Nouveau pseudo :",
            pseudo
        );

        if(
            !nouveauPseudo ||
            !nouveauPseudo.trim()
        ){
            return;
        }

        const propre = nouveauPseudo.trim();

        const resultat = await base
            .from("utilisateurs")
            .update({
                pseudo:propre
            })
            .eq("auth_id",utilisateurAuth.id);

        if(resultat.error){

            alert(resultat.error.message);

            return;
        }

        pseudo = propre;

        actualiserProfil();
    }
);

/* DÉMARRAGE */

async function demarrerMiniChat(){

    const resultatSession =
        await base.auth.getSession();

    const session =
        resultatSession.data.session;

    if(!session){

        id("connexion").style.display = "flex";

        return;
    }

    utilisateurAuth = session.user;

    const profilCorrect =
        await chargerProfilApresConnexion();

    if(!profilCorrect){

        id("connexion").style.display = "flex";

        return;
    }

    id("connexion").style.display = "none";

    actualiserProfil();

    await chargerMessagesPublics();

    await chargerGroupes();
}

/* ÉCOUTER LES CHANGEMENTS DE CONNEXION */

base.auth.onAuthStateChange(
    async (event, session) => {

        if(
            event === "SIGNED_IN" &&
            session
        ){

            utilisateurAuth = session.user;

            const profilCorrect =
                await chargerProfilApresConnexion();

            if(profilCorrect){

                id("connexion").style.display = "none";

                actualiserProfil();

                await chargerMessagesPublics();

                await chargerGroupes();
            }
        }

        if(event === "SIGNED_OUT"){

            utilisateurAuth = null;
            pseudo = "";
            conversationActuelle = null;
            destinataireActuel = "";
            groupeActuel = null;

            id("connexion").style.display = "flex";
        }
    }
);

/* BOUTON DE CONNEXION */

id("boutonConnexion").addEventListener(
    "click",
    connecterCompte
);

id("emailInput").addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){
            connecterCompte();
        }
    }
);

id("pseudoInput").addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){
            connecterCompte();
        }
    }
);

/* ACTUALISATION AUTOMATIQUE */

setInterval(() => {

    if(conversationActuelle){
        chargerMessagesPrives();
    }

    if(groupeActuel){
        chargerMessagesGroupes();
    }

},2000);

/* LANCEMENT */

demarrerMiniChat();

</script>

</body>
</html>
